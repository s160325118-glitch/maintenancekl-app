<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Inventory Maintenance</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InvKalung">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Manifest for Installation -->
    <link rel="manifest" href='data:application/json,{"name":"Sistem Inventory Maintenance","short_name":"InvKalung","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2163/2163459.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>
    
    <!-- App Icon for iOS -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2163/2163459.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .tab-active { 
            background-color: #0f172a; 
            color: white;
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2);
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 overflow-x-hidden">

    <!-- Screen: Login -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[200]">
        <div class="bg-white p-8 rounded-[32px] shadow-2xl w-full max-w-sm text-center mx-4">
            <div class="mb-8">
                <div class="bg-blue-50 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-4 rotate-3">
                    <span class="text-4xl">🔐</span>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight">Login Maintenance</h2>
                <p class="text-slate-400 text-[10px] font-bold mt-2 uppercase tracking-[0.2em]">Departemen Kalung</p>
            </div>
            <div class="relative mb-6">
                <input type="password" id="login-pin" maxlength="4" inputmode="numeric" placeholder="PIN: 1234" 
                    class="w-full px-6 py-5 border-2 border-slate-100 rounded-2xl text-center text-xl font-black outline-none focus:border-blue-500 transition-all bg-slate-50 focus:bg-white">
            </div>
            <button onclick="handleLogin()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-5 rounded-2xl transition shadow-xl active:scale-95 uppercase text-xs tracking-widest">Masuk ke Sistem</button>
            <p class="mt-6 text-[9px] text-slate-300 font-bold uppercase tracking-widest">Created By Moch Miftahus Sholihin</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="app-content" class="hidden opacity-0 transition-opacity duration-700">
        <div class="max-w-7xl mx-auto p-4 md:p-8 lg:p-12 pb-32">
            <header class="flex flex-col md:flex-row md:items-center justify-between mb-12 gap-6 border-b pb-10 border-slate-200">
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tighter text-slate-900 uppercase">Inventory Kalung</h1>
                    <p class="text-xs text-slate-400 font-bold uppercase mt-1">Sistem Manajemen Maintenance</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportPDF()" class="bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-slate-50 transition">Export PDF</button>
                    <button onclick="handleLogout()" class="text-rose-500 text-[10px] font-black uppercase tracking-widest px-4">Logout</button>
                </div>
            </header>

            <!-- Dashboard Section -->
            <div id="section-dashboard" class="space-y-8">
                 <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white p-6 rounded-[28px] border border-slate-100 shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Varian</p>
                        <h3 id="stat-variants" class="text-3xl font-black text-slate-900">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-[28px] border border-slate-100 shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Total Stok</p>
                        <h3 id="stat-stock" class="text-3xl font-black text-blue-600">0</h3>
                    </div>
                    <div class="bg-emerald-50 p-6 rounded-[28px] border border-emerald-100 shadow-sm">
                        <p class="text-[9px] font-black text-emerald-600 uppercase tracking-widest">Masuk Hari Ini</p>
                        <h3 id="stat-today-in" class="text-3xl font-black text-emerald-700">0</h3>
                    </div>
                    <div class="bg-rose-50 p-6 rounded-[28px] border border-rose-100 shadow-sm">
                        <p class="text-[9px] font-black text-rose-600 uppercase tracking-widest">Keluar Hari Ini</p>
                        <h3 id="stat-today-out" class="text-3xl font-black text-rose-700">0</h3>
                    </div>
                </div>

                <div class="bg-white rounded-[32px] shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                        <h4 class="font-black text-[10px] uppercase tracking-widest text-slate-400">Aktivitas Terakhir</h4>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-400 text-[9px] uppercase font-black">
                                <tr>
                                    <th class="px-6 py-4">Waktu</th>
                                    <th class="px-6 py-4">Barang</th>
                                    <th class="px-6 py-4">Tipe</th>
                                    <th class="px-6 py-4 text-right">Qty</th>
                                </tr>
                            </thead>
                            <tbody id="main-log-body" class="text-xs divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Transaction Section -->
            <div id="section-transaction" class="hidden space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Form Masuk -->
                    <div class="bg-white p-8 rounded-[32px] border border-slate-100 shadow-sm">
                        <h3 class="font-black text-emerald-600 uppercase text-xs tracking-widest mb-6">📥 Stok Masuk</h3>
                        <form id="form-in" class="space-y-4">
                            <select id="in-item-id" class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none border-2 border-transparent focus:border-emerald-500 transition-all" required></select>
                            <input type="number" id="in-qty" placeholder="Jumlah" class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none" required>
                            <input type="text" id="in-pic" placeholder="Nama Petugas" class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none" required>
                            <button type="submit" class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-100 active:scale-95 transition uppercase text-[10px] tracking-widest">Simpan Masuk</button>
                        </form>
                    </div>
                    <!-- Form Keluar -->
                    <div class="bg-white p-8 rounded-[32px] border border-slate-100 shadow-sm">
                        <h3 class="font-black text-rose-600 uppercase text-xs tracking-widest mb-6">📤 Stok Keluar</h3>
                        <form id="form-out" class="space-y-4">
                            <select id="out-item-id" class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none border-2 border-transparent focus:border-rose-500 transition-all" required></select>
                            <input type="number" id="out-qty" placeholder="Jumlah" class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none" required>
                            <input type="text" id="out-pic" placeholder="Nama Pengambil" class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none" required>
                            <button type="submit" class="w-full bg-rose-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-rose-100 active:scale-95 transition uppercase text-[10px] tracking-widest">Simpan Keluar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Master Section -->
            <div id="section-master" class="hidden space-y-6">
                <div class="bg-white p-8 rounded-[32px] border border-slate-100 shadow-sm max-w-2xl mx-auto">
                    <h3 class="font-black text-slate-800 uppercase text-xs tracking-widest mb-6 text-center">Tambah Varian Barang</h3>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="new-item-name" placeholder="Nama Barang (contoh: Baut M8)" class="flex-1 p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none border-2 border-transparent focus:border-blue-500 transition-all">
                        <button onclick="addItem()" class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg active:scale-95 transition">Tambah</button>
                    </div>
                </div>
                <div id="master-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <!-- Bottom Nav -->
            <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-xl border border-slate-100 p-2 rounded-[28px] shadow-2xl flex gap-2 z-50">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all tab-active">Dashboard</button>
                <button onclick="switchTab('transaction')" id="nav-transaction" class="px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest text-slate-400 transition-all">Transaksi</button>
                <button onclick="switchTab('master')" id="nav-master" class="px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest text-slate-400 transition-all">Master</button>
            </nav>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-full opacity-0 transition-all pointer-events-none z-[300] text-[10px] font-black uppercase tracking-widest"></div>

    <script>
        let bolts = JSON.parse(localStorage.getItem('dep_kalung_items')) || [{id: 1, name: 'Baut M8'}];
        let transactions = JSON.parse(localStorage.getItem('dep_kalung_logs')) || [];

        function save() {
            localStorage.setItem('dep_kalung_items', JSON.stringify(bolts));
            localStorage.setItem('dep_kalung_logs', JSON.stringify(transactions));
            updateUI();
        }

        function handleLogin() {
            if (document.getElementById('login-pin').value === "1234") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                setTimeout(() => document.getElementById('app-content').classList.add('opacity-100'), 50);
                sessionStorage.setItem('isLoggedIn_Kalung', 'true');
                updateUI();
            } else {
                showToast("PIN SALAH!");
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('isLoggedIn_Kalung');
            location.reload();
        }

        function switchTab(tab) {
            ['dashboard', 'transaction', 'master'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('tab-active');
                document.getElementById(`nav-${t}`).classList.add('text-slate-400');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('tab-active');
            document.getElementById(`nav-${tab}`).classList.remove('text-slate-400');
        }

        function addItem() {
            const name = document.getElementById('new-item-name').value.trim();
            if(!name) return;
            bolts.push({ id: Date.now(), name });
            document.getElementById('new-item-name').value = '';
            save();
            showToast("Barang ditambahkan");
        }

        function deleteItem(id) {
            if(confirm("Hapus varian ini?")) {
                bolts = bolts.filter(b => b.id !== id);
                save();
            }
        }

        document.getElementById('form-in').onsubmit = (e) => {
            e.preventDefault();
            const boltId = document.getElementById('in-item-id').value;
            const bolt = bolts.find(b => b.id == boltId);
            transactions.push({
                id: Date.now(),
                timestamp: new Date().toISOString(),
                type: 'IN',
                boltName: bolt.name,
                qty: parseInt(document.getElementById('in-qty').value),
                pic: document.getElementById('in-pic').value
            });
            save();
            e.target.reset();
            showToast("Stok masuk tersimpan");
        };

        document.getElementById('form-out').onsubmit = (e) => {
            e.preventDefault();
            const boltId = document.getElementById('out-item-id').value;
            const bolt = bolts.find(b => b.id == boltId);
            const qty = parseInt(document.getElementById('out-qty').value);
            
            const currentStock = transactions.reduce((acc, t) => t.boltName === bolt.name ? acc + (t.type === 'IN' ? t.qty : -t.qty) : acc, 0);
            if(qty > currentStock) return showToast("Stok tidak cukup!");

            transactions.push({
                id: Date.now(),
                timestamp: new Date().toISOString(),
                type: 'OUT',
                boltName: bolt.name,
                qty: qty,
                pic: document.getElementById('out-pic').value
            });
            save();
            e.target.reset();
            showToast("Stok keluar tersimpan");
        };

        function updateUI() {
            document.getElementById('stat-variants').textContent = bolts.length;
            document.getElementById('stat-stock').textContent = transactions.reduce((acc, t) => acc + (t.type === 'IN' ? t.qty : -t.qty), 0);
            
            const today = new Date().toDateString();
            document.getElementById('stat-today-in').textContent = transactions.filter(t => t.type === 'IN' && new Date(t.timestamp).toDateString() === today).reduce((a, b) => a + b.qty, 0);
            document.getElementById('stat-today-out').textContent = transactions.filter(t => t.type === 'OUT' && new Date(t.timestamp).toDateString() === today).reduce((a, b) => a + b.qty, 0);

            const opt = bolts.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            document.getElementById('in-item-id').innerHTML = opt;
            document.getElementById('out-item-id').innerHTML = opt;

            document.getElementById('master-list').innerHTML = bolts.map(b => `
                <div class="bg-white p-6 rounded-[24px] border border-slate-100 flex justify-between items-center shadow-sm">
                    <span class="font-black text-xs uppercase tracking-tight">${b.name}</span>
                    <button onclick="deleteItem(${b.id})" class="text-rose-400 hover:text-rose-600 transition">Hapus</button>
                </div>
            `).join('');

            const recentLogs = transactions.slice().reverse().slice(0, 15);
            document.getElementById('main-log-body').innerHTML = recentLogs.map(t => `
                <tr>
                    <td class="px-6 py-4 font-bold text-slate-400">${new Date(t.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
                    <td class="px-6 py-4 font-black uppercase text-slate-700">${t.boltName}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-lg font-black text-[9px] ${t.type === 'IN' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">${t.type}</span>
                    </td>
                    <td class="px-6 py-4 text-right font-black ${t.type === 'IN' ? 'text-emerald-600' : 'text-rose-600'}">${t.type === 'IN' ? '+' : '-'}${t.qty}</td>
                </tr>
            `).join('');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('opacity-100', '-translate-y-2');
            setTimeout(() => toast.classList.remove('opacity-100', '-translate-y-2'), 2500);
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text('LAPORAN INVENTORY MAINTENANCE', 14, 20);
            doc.setFontSize(10);
            doc.text(`Dicetak pada: ${new Date().toLocaleString()}`, 14, 28);

            const tableData = transactions.map(t => [
                new Date(t.timestamp).toLocaleString(),
                t.boltName,
                t.type,
                t.qty,
                t.pic
            ]);

            doc.autoTable({
                startY: 35,
                head: [['Waktu', 'Barang', 'Tipe', 'Qty', 'PIC']],
                body: tableData,
            });
            doc.save('Laporan_Inventory_Maintenance.pdf');
        }

        // Fix Service Worker: Only register if URL is https/http, avoid blob issues in preview
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                // In production (GitHub), sw.js should be a separate file
                // For this environment, we skip to avoid protocol errors
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log("SW registration skipped or failed in preview environment.");
                });
            });
        }

        window.onload = () => {
            if (sessionStorage.getItem('isLoggedIn_Kalung') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('app-content').classList.add('opacity-100');
                updateUI();
            }
        };
    </script>
</body>
</html>
